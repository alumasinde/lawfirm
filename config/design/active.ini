[application]
style_version = "v1"

[font]
body_family = "Manrope, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif"
heading_family = "\"Cormorant Garamond\", Georgia, serif"
body_weight = "500"
font_css_url = "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"

[brand]
primary = "#13283A"
primary_hover = "#0E2030"
secondary = "#A77E48"
secondary_hover = "#8E683A"
accent = "#C6A16A"

[text]
primary = "#1B2C3C"
secondary = "#56616D"
muted = "#77808A"
inverse = "#FFFFFF"
link = "#13283A"

[surface]
page = "#F7F6F2"
base = "#FFFFFF"
subtle = "#F0EEE8"
dark = "#102230"

[layout]
content_width = "1180px"
header_height = "78px"
header_height_scrolled = "68px"
sidebar_width = "270px"
container_padding = "28px"
hero_min_height = "580px"

[border]
default = "#E3DFD7"
strong = "#CFC7BB"
radius_sm = "4px"
radius_md = "8px"
radius_lg = "12px"

[spacing]
xs = "4px"
sm = "8px"
md = "16px"
lg = "24px"
xl = "40px"
xxl = "72px"
