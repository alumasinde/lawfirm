[application]
style_version = "v2"

[font]
body_family = "Manrope, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif"
heading_family = "\"Cormorant Garamond\", Georgia, serif"
body_weight = "500"
font_css_url = "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"

[brand]
primary = "#102A43"
primary_hover = "#0B2034"
secondary = "#875725"
secondary_hover = "#69431D"
accent = "#B98245"

[text]
primary = "#172A3A"
secondary = "#465667"
muted = "#667585"
inverse = "#FFFFFF"
link = "#102A43"

[surface]
page = "#F8F7F4"
base = "#FFFFFF"
subtle = "#EEEAE2"
dark = "#0C2233"

[layout]
content_width = "1180px"
header_height = "78px"
header_height_scrolled = "68px"
sidebar_width = "270px"
container_padding = "28px"
hero_min_height = "580px"

[border]
default = "#D8D1C5"
strong = "#BFB5A6"
radius_sm = "4px"
radius_md = "8px"
radius_lg = "12px"

[spacing]
xs = "4px"
sm = "8px"
md = "16px"
lg = "24px"
xl = "40px"
xxl = "72px"
